[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breakout-screener"
version = "2.0.0"
description = "Advanced breakout stock screener with real-time data analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Breakout Screener Team" }
]
maintainers = [
    { name = "Breakout Screener Team" }
]
keywords = [
    "stock-screener",
    "breakout-analysis",
    "nse-data",
    "financial-analysis",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    # Core FastAPI and async support
    "fastapi[all]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Database and ORM
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    
    # Caching and message broker
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.3.0",
    
    # HTTP client and data fetching
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    
    # Data processing and analysis
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    
    # Configuration and validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    
    # Logging and monitoring
    "structlog>=23.0.0",
    "sentry-sdk[fastapi]>=1.38.0",
    
    # Dependency injection
    "dependency-injector>=4.41.0",
    
    # Security and authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    
    # Date and time handling
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    
    # Utilities
    "click>=8.1.0",
    "rich>=13.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "httpx>=0.25.0",  # For async test client
    "faker>=19.0.0",
    
    # Code quality
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    
    # Type stubs
    "types-python-dateutil>=2.8.0",
    "types-redis>=4.6.0",
    "types-requests>=2.31.0",
    
    # Development tools
    "ipython>=8.15.0",
    "ipdb>=0.13.0",
    "watchfiles>=0.20.0",
]
prod = [
    "gunicorn>=21.2.0",
    "prometheus-client>=0.17.0",
]
all = [
    "breakout-screener[dev,prod]"
]

[project.urls]
Homepage = "https://github.com/your-org/breakout-screener-v2"
Documentation = "https://github.com/your-org/breakout-screener-v2/docs"
Repository = "https://github.com/your-org/breakout-screener-v2"
Issues = "https://github.com/your-org/breakout-screener-v2/issues"

[project.scripts]
breakout-screener = "breakout_screener.cli:main"

[tool.hatch.version]
path = "src/breakout_screener/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/breakout_screener"]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "S104",  # hardcoded bind all interfaces
    "S608",  # possible SQL injection (we use SQLAlchemy)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S106", "S311"]  # Allow assert, hardcoded passwords, random in tests

[tool.ruff.isort]
known-first-party = ["breakout_screener"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "dependency_injector.*",
    "structlog.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=breakout_screener",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Pre-commit hooks configuration should be in .pre-commit-config.yaml
# Removing from pyproject.toml to fix TOML syntax error