[tool:pytest]
# Pytest configuration for Breakout Screener V2

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --durations=10

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    repository: marks tests for repository layer
    schema: marks tests for schema validation
    database: marks tests requiring database connection

# Test coverage
# (Coverage configuration in pyproject.toml)

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*Use 'pytest.param.*:pytest.PytestRemovedWarning